name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: idx
          POSTGRES_PASSWORD: idx
          POSTGRES_DB: idx_smart_money
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U idx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://idx:idx@localhost:5432/idx_smart_money
      REDIS_URL: redis://localhost:6379
      ARJUM_API_BASE_URL: https://stock.arjum.com
      ARJUM_API_KEY: ci-placeholder-key
      OBJECT_STORAGE_ENDPOINT: http://localhost:9000
      OBJECT_STORAGE_BUCKET: idx-raw-archive
      OBJECT_STORAGE_ACCESS_KEY: minioadmin
      OBJECT_STORAGE_SECRET_KEY: minioadmin
      WEB_APP_SESSION_SECRET: ci-placeholder-session-secret-32bytes
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run DB migrations
        run: pnpm db:migrate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit / contract / property tests
        run: pnpm test

      - name: Build
        run: pnpm build

  deploy:
    needs: lint-typecheck-test-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets present
        id: check
        run: |
          if [ -n "${{ secrets.DEPLOY_HOST }}" ] && [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEPLOY_HOST/DEPLOY_SSH_KEY secrets not set; skipping deploy job."
          fi

      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.ready == 'true'
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Build production images
        if: steps.check.outputs.ready == 'true'
        run: |
          docker build -f infra/docker/Dockerfile.worker -t idx-worker:${{ github.sha }} .
          docker build -f infra/docker/Dockerfile.web -t idx-web:${{ github.sha }} .

      - name: Deploy over SSH
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main
            docker compose -f infra/docker/docker-compose.prod.yml pull
            docker compose -f infra/docker/docker-compose.prod.yml up -d --build
            docker compose -f infra/docker/docker-compose.prod.yml exec -T worker pnpm db:migrate
