version: "3.9"

# Runs on the APP VM only. worker + web, stateless (all state lives on the
# DB VM via DATABASE_URL/REDIS_URL in .env). This is the file CI/CD redeploys
# on every push to main (see .github/workflows/ci.yml's `deploy` job).

services:
  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    restart: unless-stopped
    env_file: .env

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - worker
